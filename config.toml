# 不打游戏（maibot-no-games）· 配置
#
# 作用：在消息真正发出前检查麦麦自己写的正文，命中「游戏邀约」语义就拦下或删改，
#       让它会拒绝游戏邀约、也不主动邀约或承诺参与。
# 关键：内置「拒绝话术白名单」，麦麦自己说「我不联机的，你们玩吧」时**照常发出**，
#       不会出现"拒绝被自己拦掉 → 整句都不吭声"。
#
# 日志关键字：[不打游戏]
# 被拦下的消息在发送层会额外记一条「[SendService] 发送消息失败」，这是预期行为，不是故障。

# 基础设置
[plugin]

# 插件内部名称；保持默认值即可
name = "maibot_no_games"

# 配置文件版本；保持默认值即可
config_version = "1.0.0"

# 插件版本；保持默认值即可
version = "1.0.0"

# 是否启用插件；true 开启，false 关闭
enabled = true

# 拒绝游戏邀约
[guard]

# 是否启用拦截；true 开启，false 关闭（插件仍会加载，只是不再拦）
enabled = true

# 试跑模式；true 时只把命中的消息写进日志、不真正拦截，用于先观察命中精度
# 建议：新装先开几天 dry_run，确认没有误杀再关掉
dry_run = false

# 拦截方式：
#   abort = 整条不发（默认，最严格）
#   strip = 删掉邀约那一句，其余照发；删空则不发
action = "abort"

# 额外禁止正则（追加到内置规则之后）；一般留空即可
# 例：r"(转发|分享).*(红包|优惠码)"
extra_patterns = []

# 额外禁止关键词（子串命中即拦）；一般留空即可
extra_keywords = []

# 额外「拒绝话术」正则；命中说明麦麦在回绝而非邀约，一律放行（一般留空）
# 内置已覆盖：不玩/不打/不来/不联机/不上号/算了/懒得/没空/你们玩吧/别算我/手残…
refusal_patterns = []
